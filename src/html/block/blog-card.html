<article class="blog-card @@class">
  
  <div class="blog-card__img">
    <a href="#" class="blog-card__link">
      <picture class="blog-card__picture">
        <img 
          src="@@img" 
          class="blog-card__img-content" 
          alt="@@alt" 
        >
      </picture>
    </a>
  </div>

  
  <div class="blog-card__content">
    <time datetime="@@datetime" class="blog-card__date">@@datetime</time>
    <a href="#" class="blog-card__title-link">
    <h4 class="blog-card__title">@@title</h4></a>
    <p class="blog-card__description">@@descr</p>
  </div>
    <a href="#" class="blog-card__title-link">
      
      
      <div class="blog-card__arrow-wrapper">
      <img 
        src="@@arrow" 
        class="blog-card__arrow" 
        alt="Читать далее">
        </div>
    </a>

    
</article>
